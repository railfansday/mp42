name: Auto Generate & Upload YouTube Shorts

on:
  schedule:
    # Jalan 2 kali sehari (contoh: 03:00 dan 15:00 UTC)
    - cron: "0 3,15 * * *"
  workflow_dispatch: {}

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (FFmpeg)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          pip install --upgrade pip
          pip install icrawler moviepy google-api-python-client google-auth-oauthlib

      - name: Generate and Upload YouTube Shorts
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python mp4.py
